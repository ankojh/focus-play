[project]
name = "focus-play"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "jsonschema>=4.23,<5", "python-dotenv>=1,<2",
  "numpy>=2,<3", "soundfile>=0.13,<1",
]
[project.optional-dependencies]
speech = ["kokoro>=0.9.4,<1", "transformers>=4.51,<5", "huggingface-hub>=0.30,<1", "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
